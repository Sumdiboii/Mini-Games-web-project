<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaMeFrEaK Login</title>
    <link rel="icon" href="assets/mushroom.png" type="image/png">
    <link rel="stylesheet" href="game4.css">
</head>
<body>
    
    
    <div class="login-container">
        <div class="login-portal">
            <form id="loginForm" class="login-form">
                <h1>Sign In</h1> 
                <div class="input-box">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="buttons">
                    <button type="button" onclick="authenticate()">Login</button>                    
                </div>
            </form>
        </div>

        <div class="login-con">
            <img src="assets/pexels-photo-3165335.jpeg">
        </div>

        <div class="login-logo">
            <h1>GaMeFrEaK</h1>
            <img src="assets/mushroom.png" alt="GaMeFrEaK Logo">
            <div class="buttons-link">
                <button href="game5.html">Create Account</button>
                <button href="game6.html">Forgot Password</button>
            </div>           
        </div>

    </div>

    <script src="game4.js"></script>
</body>
</html>
